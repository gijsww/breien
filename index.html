<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steken verdelen</title>
<style>
:root{--bg:#f2f6f2;--card:#fff;--ink:#1c2a22;--muted:#5f7266;--accent:#1f5a3d;--line:#d5e2d8;--soft:#e3eee6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a251e;--ink:#e6f0e9;--muted:#9bb0a2;--accent:#5fb385;--line:#2c3d33;--soft:#22322a}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a251e;--ink:#e6f0e9;--muted:#9bb0a2;--accent:#5fb385;--line:#2c3d33;--soft:#22322a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px}
label{flex:1;font-size:.9rem;color:var(--muted)}
input{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;font-size:1.3rem;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{margin-top:14px;width:100%;padding:12px;font-size:1.05rem;font-family:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;cursor:pointer}
.big{font-size:1.25rem;font-weight:bold;color:var(--accent);margin:0 0 6px}
.pattern{background:var(--soft);border-radius:10px;padding:12px;margin:10px 0}
.pattern li{margin:4px 0}
ol{padding-left:22px;margin:8px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0f1a13}}
:root[data-theme="dark"] button{color:#0f1a13}
.note{color:var(--muted);font-size:.9rem}
.err{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>🧶 Steken verdelen</h1>
<p class="sub">Gelijkmatig meerderen of minderen in één naald of toer.</p>
<div class="card">
<div class="row">
<label>Aantal steken nu<input id="start" type="number" min="1" inputmode="numeric" value="60"></label>
<label>Aantal steken straks<input id="end" type="number" min="1" inputmode="numeric" value="72"></label>
</div>
<button onclick="calc()">Bereken</button>
</div>
<div id="out"></div>
</main>
<script>
function groups(total, n){ // verdeel total over n groepen zo gelijk mogelijk
  const g=[];for(let i=1;i<=n;i++)g.push(Math.floor(i*total/n)-Math.floor((i-1)*total/n));return g;
}
function fmt(g, action){ // g = groepsgroottes, action = tekst na de gewone steken
  const parts=g.map(x=>(x>0?`brei ${x}, `:'')+action);
  const runs=[];
  for(const p of parts){const l=runs[runs.length-1];if(l&&l.t===p)l.n++;else runs.push({t:p,n:1});}
  return runs.map(r=>r.n>1?`${r.t.charAt(0).toUpperCase()+r.t.slice(1)} (${r.n}×)`:r.t.charAt(0).toUpperCase()+r.t.slice(1));
}
function calc(){
  const S=parseInt(document.getElementById('start').value),E=parseInt(document.getElementById('end').value);
  const out=document.getElementById('out');
  if(!S||!E||S<1||E<1){out.innerHTML='<div class="card err">Vul twee geldige aantallen in.</div>';return;}
  if(S===E){out.innerHTML='<div class="card">Het aantal steken blijft gelijk, er hoeft niets te veranderen.</div>';return;}
  let html='';
  if(E>S){
    const d=E-S;
    if(d>S){out.innerHTML=`<div class="card err">Je wilt ${d} steken meerderen op ${S} steken. Dat kan maximaal ${S} keer per naald. Verdeel het over meerdere naalden.</div>`;return;}
    const g=groups(S,d);
    const steps=fmt(g,'meerder 1');
    html=`<div class="card"><p class="big">${d} × meerderen</p>
    <p>Van ${S} naar ${E} steken.${d===S?' Meerder in elke steek.':` Gemiddeld om de ${(S/d).toFixed(1).replace('.',',')} steken één meerdering.`}</p>
    <div class="pattern"><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    <p class="note">Meerderen: brei in de voor- en achterlus van één steek, of neem de draad ertussen op en brei die gedraaid. Controle: ${S} + ${d} = ${E} steken.</p></div>`;
  } else {
    const d=S-E,plain=S-2*d;
    if(plain<0){out.innerHTML=`<div class="card err">Je wilt ${d} steken minderen op ${S} steken. Dat kan maximaal ${Math.floor(S/2)} keer per naald (elke vermindering gebruikt 2 steken). Verdeel het over meerdere naalden.</div>`;return;}
    const g=groups(plain,d);
    const steps=fmt(g,'2 samenbreien');
    html=`<div class="card"><p class="big">${d} × minderen</p>
    <p>Van ${S} naar ${E} steken.${plain===0?' Brei steeds 2 steken samen.':''}</p>
    <div class="pattern"><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    <p class="note">Minderen: 2 steken samenbreien (rechts of links overhellend, naar keuze). Controle: ${S} − ${d} = ${E} steken.</p></div>`;
  }
  out.innerHTML=html;
}
calc();
</script>
</body>
</html>
